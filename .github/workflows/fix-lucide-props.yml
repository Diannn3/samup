name: Fix Lucide Astro props

on:
  push:
    branches:
      - feat/samup-trust-foundation
    paths:
      - '.github/workflows/fix-lucide-props.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/samup-trust-foundation

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Convert Lucide component class props
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const walk = (dir) =>
            readdirSync(dir).flatMap((name) => {
              const full = join(dir, name);
              return statSync(full).isDirectory() ? walk(full) : [full];
            });

          let changed = 0;

          for (const file of walk('src').filter((path) => path.endsWith('.astro'))) {
            const original = readFileSync(file, 'utf8');
            const icons = new Set();
            const importPattern = /import\s*\{([\s\S]*?)\}\s*from\s*['"]lucide-react['"];?/g;

            for (const match of original.matchAll(importPattern)) {
              for (const part of match[1].split(',')) {
                const cleaned = part.trim();
                if (!cleaned) continue;
                const aliasMatch = cleaned.match(/^([A-Za-z0-9_$]+)\s+as\s+([A-Za-z0-9_$]+)$/);
                icons.add(aliasMatch ? aliasMatch[2] : cleaned);
              }
            }

            let next = original;
            for (const icon of icons) {
              const pattern = new RegExp(`<${icon}\\b([^>]*)\\bclass=`, 'g');
              next = next.replace(pattern, `<${icon}$1className=`);
            }

            if (next !== original) {
              writeFileSync(file, next);
              changed += 1;
            }
          }

          console.log(`Updated Lucide props in ${changed} Astro file(s).`);
          NODE

      - name: Format touched files
        run: npm run format

      - name: Commit Lucide prop fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No Lucide prop changes to commit."
          else
            git commit -m "fix(types): use React className prop for Lucide icons in Astro"
            git pull --rebase origin feat/samup-trust-foundation
            git push origin HEAD:feat/samup-trust-foundation
          fi

      - name: Verify Astro diagnostics
        run: npm run check

      - name: Verify build
        run: npm run build
