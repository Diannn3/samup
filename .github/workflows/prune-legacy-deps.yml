name: Prune legacy dependencies

on:
  push:
    branches:
      - feat/samup-trust-foundation
    paths:
      - '.github/workflows/prune-legacy-deps.yml'

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/samup-trust-foundation

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove obsolete packages and regenerate lockfile
        run: npm uninstall @types/three three gsap motion class-variance-authority clsx tailwind-merge

      - name: Verify build after dependency prune
        run: npm run build

      - name: Commit regenerated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): prune obsolete public UI dependencies"
          git push origin HEAD:feat/samup-trust-foundation
