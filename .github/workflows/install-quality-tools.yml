name: Install quality tooling

on:
  push:
    branches:
      - feat/samup-trust-foundation
    paths:
      - '.github/workflows/install-quality-tools.yml'

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/samup-trust-foundation

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Add quality dependencies
        run: npm install --save-dev typescript@^6.0.3 @astrojs/check prettier prettier-plugin-astro @axe-core/playwright @lhci/cli

      - name: Verify dependency installation
        run: npm run build

      - name: Commit regenerated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No quality dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(qa): add Astro-compatible quality tooling"
          git pull --rebase origin feat/samup-trust-foundation
          git push origin HEAD:feat/samup-trust-foundation
