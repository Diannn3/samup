name: SAM-UP One-shot Dependency Prune

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prune-reporting-deps.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove legacy Reporting Dossier dependencies
        run: npm uninstall pixi-viewport pixi.js zustand

      - name: Commit dependency cleanup
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): remove reporting dossier dependencies"
          git push origin HEAD:main
