name: Apply formatting
# One-shot formatter for the current redesign branch.

on:
  push:
    branches:
      - feat/samup-trust-foundation
    paths:
      - '.github/workflows/apply-formatting.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/samup-trust-foundation

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prettier
        run: npm run format

      - name: Verify formatting
        run: npm run format:check

      - name: Commit mechanical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
          else
            git commit -m "style: apply repository formatting baseline"
            git pull --rebase origin feat/samup-trust-foundation
            git push origin HEAD:feat/samup-trust-foundation
          fi

      - name: Verify Astro diagnostics
        run: npm run check

      - name: Verify build
        run: npm run build
